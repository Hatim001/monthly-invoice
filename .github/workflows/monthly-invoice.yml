name: Monthly invoice

on:
  schedule:
    # 04:00 UTC on the 1st of every month = 09:30 AM IST
    - cron: "0 4 1 * *"
  workflow_dispatch:   # "Run workflow" button, with optional overrides
    inputs:
      date:
        description: "Invoice date, YYYY-MM-DD (blank = 1st of this month)"
        required: false
        default: ""
        type: string
      bill_no:
        description: "Bill number (blank = auto: date + counter)"
        required: false
        default: ""
        type: string

permissions:
  contents: write      # needed to save the bill counter back to the repo

concurrency:
  group: monthly-invoice
  cancel-in-progress: false

jobs:
  send-invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate invoice and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_BILL_NO: ${{ inputs.bill_no }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ -n "$INPUT_BILL_NO" ]; then args+=(--bill-no "$INPUT_BILL_NO"); fi
          uv run main.py "${args[@]}"

      - name: Save bill counter
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update bill counter"
            git push
          fi

      - name: Keep a copy of the PDF
        uses: actions/upload-artifact@v4
        with:
          name: invoice
          path: output/*.pdf
